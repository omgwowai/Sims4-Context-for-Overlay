<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">游戏本体与 Overlay、Experience 的现在到未来流程图</title>
  <desc id="flow-desc">上方是游戏本体：现在的 Context 经 Autonomy 选择和游戏执行产生 Event，状态延续与事件后果形成未来 Context，并产生未来 Event。下方是 Mod：只读获取 Context 和 Event，检索 Experience 后交给 LLM，生成 Overlay。游戏事件和可选的已展示 Overlay 写入更新后的 Experience，供未来解释使用。初版没有从 Mod 向游戏状态或 Autonomy 的回写。</desc>
  <defs>
    <marker id="flow-game-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#42659c"/></marker>
    <marker id="flow-read-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3480a3"/></marker>
    <marker id="flow-memory-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11796b"/></marker>
    <marker id="flow-overlay-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7754b7"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #18283f; }
      .flow-title { font-size: 28px; font-weight: 700; }
      .flow-time { font-size: 23px; font-weight: 700; }
      .flow-band { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
      .flow-node-title { font-size: 23px; font-weight: 700; }
      .flow-node-sub { font-size: 17px; fill: #52647a; }
      .flow-small { font-size: 16px; fill: #52647a; }
      .flow-label { font-size: 17px; fill: #42659c; paint-order: stroke; stroke: #f3f7fc; stroke-width: 7px; stroke-linejoin: round; }
      .flow-read-label { font-size: 17px; fill: #28718f; paint-order: stroke; stroke: #f5faf9; stroke-width: 7px; stroke-linejoin: round; }
      .flow-memory-label { font-size: 17px; fill: #11796b; paint-order: stroke; stroke: #f5faf9; stroke-width: 7px; stroke-linejoin: round; }
      .flow-overlay-label { font-size: 17px; fill: #7754b7; paint-order: stroke; stroke: #f5faf9; stroke-width: 7px; stroke-linejoin: round; }
      .flow-edge { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.4; }
      .flow-game { stroke: #42659c; marker-end: url(#flow-game-arrow); }
      .flow-read { stroke: #3480a3; stroke-dasharray: 7 6; marker-end: url(#flow-read-arrow); }
      .flow-memory { stroke: #11796b; marker-end: url(#flow-memory-arrow); }
      .flow-overlay { stroke: #7754b7; marker-end: url(#flow-overlay-arrow); }
    </style>
  </defs>
  <rect width="1440" height="1110" rx="20" fill="#ffffff"/>
  <text x="52" y="53" class="flow-title">游戏推进 × 解释与记忆</text>
  <text x="1388" y="51" text-anchor="end" class="flow-small">概念架构 · 第一阶段</text>

  <text x="90" y="111" class="flow-time">现在 t</text>
  <text x="780" y="111" class="flow-time">未来 t+1</text>
  <path d="M90 128 H660 M780 128 H1350" stroke="#d9e2ec" stroke-width="1.5"/>
  <rect x="52" y="148" width="1336" height="258" rx="16" fill="#f3f7fc"/>
  <text x="76" y="179" class="flow-band" fill="#42659c">01 / 游戏本体</text>
  <text x="1362" y="179" text-anchor="end" class="flow-small">玩家输入、脚本和系统也可触发行为或事件</text>
  <rect x="52" y="458" width="1336" height="572" rx="16" fill="#f5faf9"/>
  <text x="76" y="438" class="flow-band" fill="#11796b">02 / MOD 解释与经历层</text>
  <text x="365" y="438" class="flow-small">只读观察</text>

  <g data-flow="game">
    <path class="flow-edge flow-game" d="M250 295 H285"/>
    <path class="flow-edge flow-game" d="M465 295 H500"/>
    <path class="flow-edge flow-game" d="M660 295 H780"/>
    <text x="720" y="279" text-anchor="middle" class="flow-label">事件后果</text>
    <path class="flow-edge flow-game" d="M940 295 H975"/>
    <path class="flow-edge flow-game" d="M1155 295 H1190"/>
    <path class="flow-edge flow-game" d="M170 248 V221 H860 V248"/>
    <text x="515" y="208" text-anchor="middle" class="flow-label">状态延续 / 时间推进</text>
  </g>

  <g data-flow="read">
    <path class="flow-edge flow-read" d="M90 316 H66 V502 H498 V698"/>
    <text x="293" y="488" class="flow-read-label">读取当时 Context</text>
    <path class="flow-edge flow-read" d="M580 342 V698"/>
    <text x="598" y="544" class="flow-read-label">事件触发</text>
    <path class="flow-edge flow-read" d="M660 322 H720 V587 H912 V698"/>
    <text x="768" y="574" text-anchor="middle" class="flow-read-label">捕获并记录游戏事实</text>
    <path class="flow-edge flow-read" d="M860 342 V502 H1180 V698"/>
    <text x="980" y="488" class="flow-read-label">读取当时 Context</text>
    <path class="flow-edge flow-read" d="M1270 342 V698"/>
    <text x="1288" y="544" class="flow-read-label">事件触发</text>
  </g>

  <g data-flow="memory">
    <path d="M212 698 V650 H824 V698" fill="none" stroke="#f5faf9" stroke-width="10" stroke-linejoin="round"/>
    <path class="flow-edge flow-memory" d="M212 698 V650 H824 V698"/>
    <text x="377" y="635" class="flow-memory-label">历史延续</text>
    <path class="flow-edge flow-memory" d="M336 757 H444"/>
    <text x="390" y="741" text-anchor="middle" class="flow-memory-label">检索</text>
    <path class="flow-edge flow-memory" d="M1038 757 H1125"/>
    <text x="1081" y="741" text-anchor="middle" class="flow-memory-label">检索</text>
  </g>

  <g data-flow="overlay">
    <path class="flow-edge flow-overlay" d="M573 816 V884"/>
    <text x="587" y="859" class="flow-overlay-label">生成 / 展示</text>
    <path class="flow-edge flow-overlay" d="M1248 816 V884"/>
    <text x="1262" y="859" class="flow-overlay-label">生成 / 展示</text>
    <path class="flow-edge flow-overlay" d="M702 933 H927 V816"/>
    <text x="827" y="961" text-anchor="middle" class="flow-overlay-label">可选写回：已展示内容</text>
  </g>

  <g data-node="game">
    <rect x="90" y="248" width="160" height="94" rx="13" fill="#e6effc" stroke="#c6d8f1"/>
    <text x="170" y="287" text-anchor="middle" class="flow-node-title">Context</text>
    <text x="170" y="316" text-anchor="middle" class="flow-node-sub">游戏状态</text>
    <rect x="285" y="248" width="180" height="94" rx="13" fill="#ffffff" stroke="#c6d8f1"/>
    <text x="375" y="287" text-anchor="middle" class="flow-node-title">Autonomy</text>
    <text x="375" y="316" text-anchor="middle" class="flow-node-sub">选择 → 游戏执行</text>
    <rect x="500" y="248" width="160" height="94" rx="13" fill="#fff1dc" stroke="#eed1a6"/>
    <text x="580" y="287" text-anchor="middle" class="flow-node-title">Event</text>
    <text x="580" y="316" text-anchor="middle" class="flow-node-sub">实际发生的事</text>
    <rect x="780" y="248" width="160" height="94" rx="13" fill="#e6effc" stroke="#c6d8f1"/>
    <text x="860" y="287" text-anchor="middle" class="flow-node-title">Context</text>
    <text x="860" y="316" text-anchor="middle" class="flow-node-sub">更新后的状态</text>
    <rect x="975" y="248" width="180" height="94" rx="13" fill="#ffffff" stroke="#c6d8f1"/>
    <text x="1065" y="287" text-anchor="middle" class="flow-node-title">Autonomy</text>
    <text x="1065" y="316" text-anchor="middle" class="flow-node-sub">选择 → 游戏执行</text>
    <rect x="1190" y="248" width="160" height="94" rx="13" fill="#fff1dc" stroke="#eed1a6"/>
    <text x="1270" y="287" text-anchor="middle" class="flow-node-title">Event</text>
    <text x="1270" y="316" text-anchor="middle" class="flow-node-sub">后续发生的事</text>
  </g>

  <g data-node="memory">
    <rect x="88" y="698" width="248" height="118" rx="14" fill="#e3f3ee" stroke="#b9ded2"/>
    <text x="212" y="734" text-anchor="middle" class="flow-node-title">Experience</text>
    <text x="212" y="765" text-anchor="middle" class="flow-node-sub">此前的事件、记忆</text>
    <text x="212" y="790" text-anchor="middle" class="flow-node-sub">与已展示的叙事</text>
    <rect x="786" y="698" width="252" height="118" rx="14" fill="#e3f3ee" stroke="#b9ded2"/>
    <text x="912" y="734" text-anchor="middle" class="flow-node-title">Experience</text>
    <text x="912" y="765" text-anchor="middle" class="flow-node-sub">历史 + 新事件</text>
    <text x="912" y="790" text-anchor="middle" class="flow-node-sub">+ 可选叙事记录</text>
  </g>

  <g data-node="overlay">
    <rect x="444" y="698" width="258" height="118" rx="14" fill="#f0eafa" stroke="#d9cbed"/>
    <text x="573" y="734" text-anchor="middle" class="flow-node-title">LLM 解释生成</text>
    <text x="573" y="765" text-anchor="middle" class="flow-node-sub">Context 快照 + Event</text>
    <text x="573" y="790" text-anchor="middle" class="flow-small">+ 检索到的相关 Experience</text>
    <rect x="1125" y="698" width="245" height="118" rx="14" fill="#f0eafa" stroke="#d9cbed"/>
    <text x="1248" y="734" text-anchor="middle" class="flow-node-title">LLM 解释生成</text>
    <text x="1248" y="765" text-anchor="middle" class="flow-node-sub">Context 快照 + Event</text>
    <text x="1248" y="790" text-anchor="middle" class="flow-small">+ 检索到的相关 Experience</text>
    <rect x="444" y="884" width="258" height="98" rx="14" fill="#ffffff" stroke="#d9cbed"/>
    <text x="573" y="925" text-anchor="middle" class="flow-node-title">Overlay</text>
    <text x="573" y="956" text-anchor="middle" class="flow-node-sub">实际展示的文字气泡</text>
    <rect x="1125" y="884" width="245" height="98" rx="14" fill="#ffffff" stroke="#d9cbed"/>
    <text x="1248" y="925" text-anchor="middle" class="flow-node-title">Overlay</text>
    <text x="1248" y="956" text-anchor="middle" class="flow-node-sub">带有历史连续性的气泡</text>
  </g>
  <text x="88" y="900" class="flow-small">初版边界</text>
  <text x="88" y="930" font-size="19" font-weight="700" fill="#11796b">Experience 与 Overlay</text>
  <text x="88" y="960" font-size="19" font-weight="700" fill="#11796b">只影响解释，不回写 Autonomy</text>
  <text x="88" y="1010" class="flow-small">t+1 表示后续观察点；Experience 的“未来”表示写入后的版本，事件发生后即可记录。</text>

  <g font-size="16">
    <path d="M78 1071 H118" class="flow-edge flow-game"/><text x="132" y="1077">游戏推进</text>
    <path d="M330 1071 H370" class="flow-edge flow-read"/><text x="384" y="1077">只读采集 / 触发</text>
    <path d="M648 1071 H688" class="flow-edge flow-memory"/><text x="702" y="1077">经历保留 / 检索</text>
    <path d="M985 1071 H1025" class="flow-edge flow-overlay"/><text x="1039" y="1077">生成 / 可选叙事写回</text>
  </g>
</svg>

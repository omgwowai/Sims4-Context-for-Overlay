<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="steak-title steak-desc">
  <title id="steak-title">牛排约会：事实成为经历，经历成为未来气泡中的回忆</title>
  <desc id="steak-desc">第一次约会中 A 与 B 吃牛排。游戏事实与已展示台词分开记录。未来二人再次吃牛排时，检索同一对角色关于牛排的共同经历，结合当前关系与情绪，生成回忆第一次约会的气泡。已展示气泡可以继续写入叙事记录。</desc>
  <defs>
    <marker id="steak-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#11796b"/></marker>
    <marker id="steak-purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7754b7"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #18283f; }
      .steak-title { font-size: 28px; font-weight: 700; }
      .steak-heading { font-size: 23px; font-weight: 700; }
      .steak-body { font-size: 19px; }
      .steak-small { font-size: 17px; fill: #52647a; }
      .steak-edge { fill: none; stroke: #11796b; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#steak-arrow); }
    </style>
  </defs>
  <rect width="1440" height="660" rx="20" fill="#ffffff"/>
  <text x="52" y="54" class="steak-title">同样是牛排，后来多了一段共同回忆</text>
  <text x="52" y="88" class="steak-small">示例前提：已有依据确认第一次约会；A 与 B 都亲历了这次用餐。</text>

  <rect x="52" y="120" width="400" height="455" rx="16" fill="#f3f7fc"/>
  <rect x="508" y="120" width="370" height="455" rx="16" fill="#f5faf9"/>
  <rect x="934" y="120" width="454" height="455" rx="16" fill="#f8f5fc"/>
  <text x="78" y="163" class="steak-heading">01 / 第一次约会</text>
  <text x="534" y="163" class="steak-heading">02 / 留下经历</text>
  <text x="960" y="163" class="steak-heading">03 / 后来再次吃牛排</text>

  <rect x="78" y="193" width="348" height="126" rx="12" fill="#ffffff" stroke="#d3e0ef"/>
  <text x="99" y="231" class="steak-body" font-weight="700">Event：A 与 B 一起吃牛排</text>
  <text x="99" y="269" class="steak-small">Context：同一次约会、餐厅</text>
  <text x="99" y="296" class="steak-small">保存参与者、时间、情境与食物类型</text>

  <rect x="78" y="378" width="348" height="123" rx="12" fill="#f0eafa" stroke="#d9cbed"/>
  <text x="99" y="414" class="steak-small">Overlay · 已展示的示例台词</text>
  <text x="99" y="451" class="steak-body">“这顿牛排，我大概会记很久。”</text>
  <text x="99" y="482" class="steak-small">可选保存，并标明说话者与可知角色</text>

  <path d="M426 254 H534" class="steak-edge"/>
  <rect x="534" y="193" width="318" height="126" rx="12" fill="#e3f3ee" stroke="#b9ded2"/>
  <text x="555" y="231" class="steak-body" font-weight="700">事实记录 → 共同记忆</text>
  <text x="555" y="269" class="steak-small">A + B / 第一次约会 / 牛排</text>
  <text x="555" y="296" class="steak-small">记忆摘要保留原始事件引用</text>

  <path d="M426 440 H534" fill="none" stroke="#7754b7" stroke-width="2.4" marker-end="url(#steak-purple-arrow)"/>
  <rect x="534" y="378" width="318" height="123" rx="12" fill="#ffffff" stroke="#d9cbed"/>
  <text x="555" y="416" class="steak-body" font-weight="700">单独保存叙事记录</text>
  <text x="555" y="451" class="steak-small">保存实际展示内容与来源</text>
  <text x="555" y="481" class="steak-small">台词内容不自动成为游戏事实</text>

  <rect x="960" y="193" width="402" height="91" rx="12" fill="#fff1dc" stroke="#eed1a6"/>
  <text x="981" y="230" class="steak-body" font-weight="700">新 Event：二人再次吃牛排</text>
  <text x="981" y="260" class="steak-small">可以是另一份牛排，也可以换一家餐厅</text>
  <path d="M1161 284 V328" class="steak-edge"/>
  <path d="M852 254 H906 V369 H960" class="steak-edge"/>
  <text x="870" y="353" class="steak-small" text-anchor="middle" transform="rotate(-90 870 353)">检索相关经历</text>
  <rect x="960" y="328" width="402" height="83" rx="12" fill="#e3f3ee" stroke="#b9ded2"/>
  <text x="1161" y="360" text-anchor="middle" class="steak-body" font-weight="700">同一对角色 + 牛排 → 检索共同经历</text>
  <text x="1161" y="390" text-anchor="middle" class="steak-small">再结合当前 Context，交给 LLM</text>
  <path d="M1161 411 V448" fill="none" stroke="#7754b7" stroke-width="2.4" marker-end="url(#steak-purple-arrow)"/>
  <rect x="960" y="448" width="402" height="94" rx="12" fill="#f0eafa" stroke="#d9cbed"/>
  <text x="981" y="481" class="steak-small">未来 Overlay</text>
  <text x="981" y="516" class="steak-body">“还记得第一次约会时的牛排吗？”</text>

  <text x="78" y="551" class="steak-small">游戏继续决定角色下一步做什么。</text>
  <text x="534" y="352" class="steak-small">Experience 保留经历与叙事的来源。</text>
  <path d="M1362 495 H1407 V605 H693 V501" fill="none" stroke="#7754b7" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#steak-purple-arrow)"/>
  <text x="1050" y="632" text-anchor="middle" class="steak-small">可选：把这次实际展示的气泡继续写回叙事记录</text>
</svg>
